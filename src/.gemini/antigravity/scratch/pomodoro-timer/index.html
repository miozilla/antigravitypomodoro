<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>25:00 - Focus | Pomodoro Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body data-mode="focus">
  <main class="app-container">
    <!-- Header / Branding & Daily Status -->
    <header class="app-header">
      <div class="logo">
        <span class="logo-dot"></span>
        <span class="logo-text">pomodoro focus</span>
      </div>

      <div class="header-status">
        <div id="date-display" class="date-badge">Today</div>
        <div class="streak-badge" id="streak-badge" title="Daily Focus Streak">
          <span class="streak-icon">🌱</span>
          <span id="streak-count">1 day streak</span>
        </div>
      </div>
    </header>

    <!-- 2-Column Responsive Dashboard -->
    <div class="dashboard-grid">
      <!-- Left Column: Clock Timer & Cycle Indicators -->
      <div class="dashboard-col left-col">
        <section class="timer-card" aria-label="Pomodoro Timer">
          <!-- Mode Tabs -->
          <nav class="mode-tabs" role="tablist" aria-label="Timer Modes">
            <button class="tab-btn active" role="tab" aria-selected="true" data-mode="focus">Focus</button>
            <button class="tab-btn" role="tab" aria-selected="false" data-mode="short-break">Short Break</button>
            <button class="tab-btn" role="tab" aria-selected="false" data-mode="long-break">Long Break</button>
          </nav>

          <!-- Timer Ring & Display -->
          <div class="timer-display-wrapper">
            <svg class="progress-ring" viewBox="0 0 320 320" aria-hidden="true">
              <circle class="progress-ring-bg" cx="160" cy="160" r="140"></circle>
              <circle class="progress-ring-fill" id="progress-ring" cx="160" cy="160" r="140"></circle>
            </svg>

            <div class="time-readout">
              <div id="time-display" class="time-text">25:00</div>
              <div id="mode-label" class="mode-caption">Time to focus</div>
            </div>
          </div>

          <!-- Controls -->
          <div class="controls-container">
            <button id="toggle-btn" class="control-btn primary-btn" aria-label="Start timer">
              <span id="toggle-text">Start</span>
            </button>
            <button id="reset-btn" class="control-btn secondary-btn" aria-label="Reset timer">
              <span>Reset</span>
            </button>
          </div>

          <!-- Session Cycle Dots -->
          <div class="session-cycle-wrapper">
            <span class="cycle-label">Session Cycle</span>
            <div id="cycle-dots" class="cycle-dots" aria-label="Completed focus sessions in cycle">
              <!-- Rendered via JavaScript (4 dots per cycle) -->
            </div>
          </div>
        </section>

        <!-- Ambient Soundscapes Card -->
        <section class="ambient-card" aria-label="Ambient Soundscapes">
          <div class="ambient-header">
            <div class="card-title-group">
              <h2 class="card-title">Ambient Sound</h2>
              <span class="ambient-tag">Deep Brown Noise</span>
            </div>
            <button id="ambient-play-btn" class="ambient-play-btn" aria-label="Play ambient sound">
              <svg id="ambient-play-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span id="ambient-play-text">Play</span>
            </button>
          </div>

          <!-- Volume & Auto-play Controls -->
          <div class="ambient-controls">
            <!-- Volume Slider Row -->
            <div class="ambient-volume-row">
              <button id="ambient-mute-btn" class="icon-link-btn" title="Toggle mute" aria-label="Toggle mute">
                <svg id="ambient-volume-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                  <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                  <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                </svg>
              </button>
              <input 
                type="range" 
                id="ambient-volume-slider" 
                class="ambient-slider" 
                min="0" 
                max="100" 
                value="50" 
                aria-label="Ambient sound volume"
              >
              <span id="ambient-volume-text" class="ambient-vol-label">50%</span>
            </div>

            <!-- Auto-play on Focus Switch -->
            <div class="ambient-autoplay-row">
              <label for="ambient-autoplay-toggle" class="autoplay-label">
                <span class="autoplay-text">Auto-play on Focus</span>
                <span class="autoplay-sub">Starts & stops with countdown</span>
              </label>
              <label class="switch">
                <input type="checkbox" id="ambient-autoplay-toggle">
                <span class="switch-slider"></span>
              </label>
            </div>
          </div>
        </section>
      </div>

      <!-- Right Column: Productivity Analytics & Session Tasks -->
      <div class="dashboard-col right-col">
        <!-- Productivity Analytics Card -->
        <section class="analytics-card" aria-label="Productivity Analytics">
          <div class="analytics-header">
            <div class="card-title-group">
              <h2 class="card-title">Daily Analytics</h2>
              <span class="analytics-tag">Today</span>
            </div>
            <button id="reset-stats-btn" class="icon-link-btn" title="Reset today's stats" aria-label="Reset today's stats">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="1 4 1 10 7 10"></polyline>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
              </svg>
            </button>
          </div>

          <!-- 3 Stats Pillars -->
          <div class="analytics-stats-grid">
            <div class="stat-pill">
              <span id="stat-sessions" class="stat-value">0</span>
              <span class="stat-label">Focus Sessions</span>
            </div>
            <div class="stat-pill">
              <span id="stat-time" class="stat-value">0m</span>
              <span class="stat-label">Focus Time</span>
            </div>
            <div class="stat-pill">
              <span id="stat-tasks" class="stat-value">0</span>
              <span class="stat-label">Tasks Done</span>
            </div>
          </div>

          <!-- Daily Goal Progress -->
          <div class="goal-container">
            <div class="goal-header">
              <span class="goal-title">Daily Goal</span>
              <span id="goal-status" class="goal-status">0 / 4 sessions</span>
            </div>
            <div class="goal-track">
              <div id="goal-bar" class="goal-fill" style="width: 0%;"></div>
            </div>
          </div>
        </section>

        <!-- Task Tracker Card -->
        <section class="tasks-card" aria-label="Task Tracker">
          <div class="tasks-header">
            <div class="tasks-title-wrapper">
              <h2 class="card-title">Session Tasks</h2>
              <span id="tasks-counter" class="tasks-counter">0 / 0</span>
            </div>
            <button id="clear-completed-btn" class="clear-btn" type="button" style="display: none;">Clear done</button>
          </div>

          <!-- Add Task Form -->
          <form id="task-form" class="task-input-wrapper">
            <input 
              type="text" 
              id="task-input" 
              class="task-input" 
              placeholder="What are you working on?" 
              autocomplete="off"
              maxlength="100"
              aria-label="New task name"
              required
            >
            <button type="submit" id="add-task-btn" class="add-task-btn" aria-label="Add task">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </form>

          <!-- Task Items List -->
          <ul id="task-list" class="task-list" role="list"></ul>

          <!-- Empty State -->
          <div id="tasks-empty" class="tasks-empty">
            <p>No tasks yet. Add a focus item for this session.</p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
